[project]
name = "ledgion"
version = "0.1.0"
description = "Retrieval-augmented QA over SEC filings, benchmarked on FinanceBench, with page-level citations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.0.1",
    "typer>=0.27.2",
]

[project.scripts]
ledgion = "ledgion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgion"]

# CPU-only torch. The default PyPI wheel bundles CUDA (multi-GB) on Windows;
# pinning the torch source to PyTorch's cpu index keeps it small and makes even
# the transitive torch (via sentence-transformers) resolve to the cpu build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "A"]

[tool.ruff.lint.per-file-ignores]
# The Windows UTF-8 stdout guard must run before other imports (E402).
"ledgion/cli.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
