# Ledgion resolved configuration.
#
# Source of truth for every pipeline knob. Override per-machine / per-CI via
# environment variables (prefix LEDGION_, nested with __) or a local .env,
# e.g. LEDGION_QDRANT__MODE=memory or LEDGION_RETRIEVAL__TOP_K=10.
# See ledgion/config.py for the loader and precedence rules.

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache         # embedding cache lives at <cache_dir>/embeddings (gitignored)

# Hand-maintained company -> ticker map. FinanceBench ships NO ticker field, so
# ticker provenance lives HERE, keyed by the FinanceBench `company` name exactly.
# EXTEND THIS when the corpus grows past these 5 filings — an unmapped company
# raises at ingest time (never a silently-blank ticker). ticker is stored in the
# Qdrant payload AND indexed as a filterable field, so Phase-6 metadata-filtered
# retrieval needs no re-index.
tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  # Physical cores only (i5-9300H has 4). Hyperthreading hurts this workload.
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a   # pinned commit (2026-09-18); folded into the cache key
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  # bge asks *queries* (not documents) to carry this instruction for retrieval.
  # Kept in config so "instruction vs none" stays a measurable ablation.
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a   # pinned commit (2026-09-18); wired into CrossEncoder in Phase 3
  device: cpu
  top_n: 5                  # rerank_top_n

sparse:
  backend: rank_bm25        # rank_bm25 first, then fastembed into Qdrant
  fastembed_model: Qdrant/bm25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true   # chunks never span a page boundary

retrieval:
  top_k: 50                 # candidates pulled before rerank

fusion:
  method: rrf               # rrf | weighted
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0

qdrant:
  mode: docker              # docker (dev) | memory (CI, in-process)
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0          # deterministic; never a local model in serving
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0        # 0 disables thinking; it otherwise eats max_output_tokens
  max_retries: 5            # retry transient 429/5xx (e.g. model overloaded)
  retry_base_delay_s: 2.0   # backoff before attempt n = retry_base_delay_s * 2**n

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1                   # Tier 1 = deterministic, fully offline
  ragas_enabled: false      # Tier 2 (judged) only
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k                # recall at the full candidate depth (retrieval.top_k)
    - recall@10               # same recall_at_k function, fixed cutoff of 10
    - ndcg@10
    - mrr
    - hit@1
