# Experiment: hybrid_rerank — the best Phase-6 row (hybrid sw0.25, stopwords) + reranking.
#
# hybrid_stopwords_sw0.25 was Phase 6's strongest hybrid row. At sparse_weight 0.25 no
# sparse-only chunk can enter the top-50 (0.25/(60+1) < 1/(60+50)), so the fused pool is
# dense's top-50 reordered — which is why this run is EXPECTED to track dense_rerank
# closely. That's a prediction to verify, not a reason to skip: if hybrid_rerank and
# dense_rerank diverge, the sw<0.55 "identical candidate set" claim is wrong.
#
# Same metric semantics as dense_rerank: whole top_k pool reranked and scored, so
# recall@k (=recall@50) must be the pool-integrity invariant .816667 (the fused pool =
# dense's pool as a set). recall@10 is what moves.
#
#   uv run ledgion eval --tier 1 --config config/experiments/hybrid_rerank.yaml

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache

tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  device: cpu
  enabled: true
  batch_size: 32
  top_n: 5

sparse:
  backend: rank_bm25
  fastembed_model: Qdrant/bm25
  lowercase: true
  token_pattern: "[A-Za-z0-9]+"
  remove_stopwords: true
  k1: 1.5
  b: 0.75
  epsilon: 0.25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true

retrieval:
  top_k: 50
  backend: hybrid

fusion:
  method: rrf
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 0.25

qdrant:
  mode: docker
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0
  max_retries: 5
  retry_base_delay_s: 2.0

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1
  ragas_enabled: false
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k                # = recall@50; invariant .816667 (fused pool = dense's set)
    - recall@10
    - recall@50
    - ndcg@10
    - mrr
    - hit@1
