# Experiment: dense_rerank_k100 — dense at top_k=100 + cross-encoder reranking.
#
# Prices the deeper pool against its latency: reranking a 100-candidate pool can
# promote evidence that lives between ranks 51–100 into the top 10, but doubles the
# cross-encoder work per query. Compare its recall@10 (and rerank p95) against
# dense_rerank (top_k=50) to see whether the deeper pool is worth the cost.
#
# Metric semantics (DECISIONS.md Phase 7): recall@k resolves to recall@100 here, so
# its pool-integrity invariant is recall@100 == dense_k100's recall@100 (predicted
# .885714, 31/35 within depth 100), NOT .816667. recall@10 and recall@50 are reported
# as comparable QUALITY columns — recall@50 is NOT an invariant at this depth.
#
#   uv run ledgion eval --tier 1 --config config/experiments/dense_rerank_k100.yaml

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache

tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  device: cpu
  enabled: true
  batch_size: 32
  top_n: 5

sparse:
  backend: rank_bm25
  fastembed_model: Qdrant/bm25
  lowercase: true
  token_pattern: "[A-Za-z0-9]+"
  remove_stopwords: false
  k1: 1.5
  b: 0.75
  epsilon: 0.25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true

retrieval:
  top_k: 100                # deeper pool; = the frozen rerank candidate depth
  backend: dense

fusion:
  method: rrf
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0

qdrant:
  mode: docker
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0
  max_retries: 5
  retry_base_delay_s: 2.0

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1
  ragas_enabled: false
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k                # = recall@100 here; invariant vs dense_k100 (.885714)
    - recall@10               # what reranking promotes from the deeper pool
    - recall@50               # QUALITY column at this depth, NOT a pool-integrity invariant
    - ndcg@10
    - mrr
    - hit@1
