# Experiment: dense_k100 — dense-only retrieval at top_k=100, NO reranking.
#
# The companion baseline for dense_rerank_k100's pool-integrity invariant: at
# top_k=100 recall@k is recall@100, and a reranked run must reproduce this run's
# recall@100 exactly (reranking reorders the 100-candidate pool, never adds to it).
# The depth diagnostic predicts .885714 (31 of 35 evidence pairs within depth 100) —
# assert that value; any deviation is a bug, not a finding. (Same role dense's
# .816667 plays for the top_k=50 rows.)
#
#   uv run ledgion eval --tier 1 --config config/experiments/dense_k100.yaml

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache

tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  device: cpu
  enabled: false            # the companion is deliberately un-reranked
  batch_size: 32
  top_n: 5

sparse:
  backend: rank_bm25
  fastembed_model: Qdrant/bm25
  lowercase: true
  token_pattern: "[A-Za-z0-9]+"
  remove_stopwords: false
  k1: 1.5
  b: 0.75
  epsilon: 0.25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true

retrieval:
  top_k: 100
  backend: dense

fusion:
  method: rrf
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0

qdrant:
  mode: docker
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0
  max_retries: 5
  retry_base_delay_s: 2.0

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1
  ragas_enabled: false
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k                # = recall@100; the invariant dense_rerank_k100 must match (.885714)
    - recall@10
    - recall@50
    - ndcg@10
    - mrr
    - hit@1
