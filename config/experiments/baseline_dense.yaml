# Experiment: baseline_dense — the first recorded configuration.
#
# Dense-only retrieval (embed query -> Qdrant cosine -> top_k). NO BM25, NO
# fusion, NO reranker, NO query rewriting: the honest floor every later ablation
# (sparse, fusion, rerank, query rewriting) is measured against.
#
# An experiment file is a FROZEN, SELF-CONTAINED snapshot. `ledgion eval --config`
# reads this file *instead of* config/default.yaml (env/.env still layer on top),
# so it must fully specify the run — that is what makes its results/<hash>.json
# reproducible forever. Later experiments are sibling files in config/experiments/
# that change one knob at a time; the delta between their results is the point.
#
#   uv run ledgion eval --tier 1 --config config/experiments/baseline_dense.yaml

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache

tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  device: cpu
  top_n: 5

sparse:
  backend: rank_bm25
  fastembed_model: Qdrant/bm25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true

retrieval:
  top_k: 50                 # candidates pulled before rerank (dense-only feeds them straight through)

fusion:
  method: rrf
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0

qdrant:
  mode: docker              # docker (dev, corpus loaded) | memory (CI, in-process)
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0
  max_retries: 5
  retry_base_delay_s: 2.0

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1                   # Tier 1 = deterministic, fully offline
  ragas_enabled: false      # Tier 2 (judged) only; never gates a build
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k
    - recall@10
    - ndcg@10
    - mrr
    - hit@1
