# Experiment: hybrid_rrf — dense + sparse, fused by Reciprocal Rank Fusion.
#
# The Phase 6 headline candidate. Both arms pull retrieval.top_k candidates; the
# user's reciprocal_rank_fusion (fusion.method: rrf, smoothed by fusion.rrf_k)
# merges them into one ranking. One knob vs baseline_dense (retrieval.backend:
# dense -> hybrid), so the delta isolates what fusion adds over dense alone; compare
# against sparse_only too to see whether fusion beats either arm on its own.
#
#   uv run ledgion eval --tier 1 --config config/experiments/hybrid_rrf.yaml \
#     --compare results/<dense_hash>.json --compare results/<sparse_hash>.json

paths:
  data_dir: data
  pdf_dir: data/pdfs
  financebench_dir: data/financebench
  results_dir: results
  cache_dir: .cache

tickers:
  Amcor: AMCR
  AMD: AMD
  American Express: AXP
  Boeing: BA
  PepsiCo: PEP

torch:
  num_threads: 4

embedding:
  model_id: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  device: cpu
  batch_size: 32
  normalize: true
  max_seq_length: 512
  query_instruction: "Represent this sentence for searching relevant passages:"

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  device: cpu
  top_n: 5

sparse:
  backend: rank_bm25
  fastembed_model: Qdrant/bm25
  lowercase: true
  token_pattern: "[A-Za-z0-9]+"
  remove_stopwords: false
  k1: 1.5
  b: 0.75
  epsilon: 0.25

chunk:
  size: 448
  overlap: 64
  unit: tokens
  respect_page_boundary: true

retrieval:
  top_k: 50
  backend: hybrid           # the knob this experiment flips (vs baseline_dense)

fusion:
  method: rrf               # reciprocal rank fusion (the user's fusion logic)
  rrf_k: 60                 # RRF smoothing constant
  dense_weight: 1.0
  sparse_weight: 1.0

qdrant:
  mode: docker
  url: http://localhost:6333
  path: qdrant_storage
  collection_name: ledgion_filings
  prefer_grpc: false

generation:
  provider: gemini
  model: gemini-3.8-flash
  temperature: 0.0
  max_output_tokens: 2048
  api_key_env: GEMINI_API_KEY
  thinking_budget: 0
  max_retries: 5
  retry_base_delay_s: 2.0

tracing:
  enabled: false
  provider: langfuse
  host: https://cloud.langfuse.com
  public_key_env: LANGFUSE_PUBLIC_KEY
  secret_key_env: LANGFUSE_SECRET_KEY

eval:
  tier: 1
  ragas_enabled: false
  judge_model: gemini-2.0-flash
  metrics:
    - recall@k
    - recall@10
    - ndcg@10
    - mrr
    - hit@1
